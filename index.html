<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>健身紀錄</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#0a0d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="健身紀錄">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
</head>
<body>
  <div id="app">
    <header id="header">
      <button id="back-btn" onclick="App.back()" aria-label="返回"><i class="ic" style="-webkit-mask-image:url(assets/icons/arrow-left.svg);mask-image:url(assets/icons/arrow-left.svg)"></i></button>
      <h1 id="header-title">健身紀錄</h1>
      <div id="header-right"></div>
    </header>

    <main id="content"></main>

    <nav id="bottom-nav">
      <button class="nav-item" data-tab="home" onclick="App.goHome()">
        <i class="ic nav-icon" style="-webkit-mask-image:url(assets/icons/home.svg);mask-image:url(assets/icons/home.svg)"></i>
        <span class="nav-label">首頁</span>
      </button>
      <button class="nav-item" data-tab="avatar" onclick="App.goTo('avatar', {})">
        <i class="ic nav-icon" style="-webkit-mask-image:url(assets/icons/user.svg);mask-image:url(assets/icons/user.svg)"></i>
        <span class="nav-label">角色</span>
      </button>
      <button class="nav-item" data-tab="history" onclick="App.goTo('history', {})">
        <i class="ic nav-icon" style="-webkit-mask-image:url(assets/icons/calendar.svg);mask-image:url(assets/icons/calendar.svg)"></i>
        <span class="nav-label">歷史</span>
      </button>
      <button class="nav-item" data-tab="progress" onclick="App.goTo('progress', {})">
        <i class="ic nav-icon" style="-webkit-mask-image:url(assets/icons/chart-bar.svg);mask-image:url(assets/icons/chart-bar.svg)"></i>
        <span class="nav-label">進度</span>
      </button>
      <button class="nav-item" id="timer-nav-btn" onclick="timerNavTap()">
        <i class="ic nav-icon" id="timer-nav-icon" style="-webkit-mask-image:url(assets/icons/stopwatch.svg);mask-image:url(assets/icons/stopwatch.svg)"></i>
        <span class="nav-label" id="timer-nav-label">計時</span>
      </button>
    </nav>
  </div>

  <div id="toast"></div>
  <!-- GSAP 3.12.5 + Lenis 1.1.14 自架（assets/vendor/）；載入失敗時 anim.js 自動降級 -->
  <script>
    // 正式網址只用 firebaseapp.com：登入網域（authDomain）在這裡，web.app 上 redirect 登入會被瀏覽器擋
    if (location.hostname === 'fitness-app-yaray.web.app') location.replace('https://fitness-app-yaray.firebaseapp.com' + location.pathname + location.search);
  </script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="js/exercise-index.js"></script>
  <script src="js/exercise-map.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/sprite-data.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
